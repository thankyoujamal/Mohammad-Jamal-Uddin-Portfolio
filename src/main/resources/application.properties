spring.application.name=portfolio-classic
server.port=${PORT:8080}

# Local development: file-based H2 database in ./data
spring.datasource.url=jdbc:h2:file:./data/portfolio
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# View saved contact messages at http://localhost:8080/h2-console (JDBC URL above, user sa)
spring.h2.console.enabled=true
